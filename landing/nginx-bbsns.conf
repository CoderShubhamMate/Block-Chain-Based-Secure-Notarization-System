# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name bbsns.online api.bbsns.online;
    return 301 https://$host$request_uri;
}

# Main Domain: bbsns.online -> Static Landing Page
server {
    listen 443 ssl;
    server_name bbsns.online;

    root /var/www/bbsns-landing;
    index index.html;

    # SSL Configuration (Authoritative Let's Encrypt Certs)
    ssl_certificate /etc/letsencrypt/live/bbsns.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbsns.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API Subdomain: api.bbsns.online -> Express Backend (Unchanged Logic)
server {
    listen 443 ssl;
    server_name api.bbsns.online;

    # Enforce production-grade body limit (Matches backend document limit)
    client_max_body_size 25M;

    # SSL Configuration (Authoritative Let's Encrypt Certs)
    ssl_certificate /etc/letsencrypt/live/bbsns.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbsns.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
